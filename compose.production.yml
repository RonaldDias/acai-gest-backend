services:
  postgres:
    image: postgres:16-alpine
    container_name: acai_gest_db
    env_file:
      - .env.production
    environment:
      - PGTZ: UTC-3
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - acai_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: acai_gest_backend
    restart: always
    ports:
      - "127.0.0.1:3001:3001"
    env_file:
      - .env.production
    volumes:
      - ./backups:/app/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - acai_network
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  acai_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
